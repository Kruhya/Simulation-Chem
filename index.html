<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#eef3f4">
<title>Precipitation Reaction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3f4;--bg-glow:radial-gradient(1100px 600px at 15% -10%,#e1f3f1 0%,transparent 60%),radial-gradient(900px 500px at 100% 0%,#eafaf9 0%,transparent 55%);
  --card:#ffffff;--card-soft:#f5f8f8;--line:#e2e8ec;--line-soft:#eaeff1;
  --ink:#1e293b;--muted:#64748b;--muted-dim:#94a3b8;
  --cyan:#0f766e;--cyan-soft:rgba(15,118,110,.10);--cyan-line:rgba(15,118,110,.35);
  --amber:#0f766e;--amber-soft:rgba(15,118,110,.10);
  --water1:#bdeef2;--water2:#eafcfd;
  --danger:#dc2626;
  --radius:18px;--radius-sm:11px;
  --font-display:'Space Grotesk',sans-serif;--font-body:'IBM Plex Sans Thai','Space Grotesk',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--font-body);color:var(--ink);background:var(--bg-glow),var(--bg);
  display:flex;justify-content:center;padding:20px 14px 44px;
}
button{font:inherit}
.app{width:min(100%,920px)}

/* ---------- topbar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;
  background:var(--cyan-soft);border:1px solid var(--line);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);
}
.brand h1{font-family:var(--font-display);font-size:1.2rem;margin:0;font-weight:700;letter-spacing:.2px}
.sub{margin:2px 0 0;color:var(--muted);font-size:.76rem}
.fs-btn{border:1px solid var(--line);background:var(--card-soft);color:var(--muted);width:42px;height:42px;border-radius:11px;cursor:pointer;font-size:1.05rem;display:flex;align-items:center;justify-content:center;transition:.15s;flex:none}
.fs-btn:hover{border-color:var(--cyan-line);color:var(--cyan)}

/* ---------- shared card ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 30px -18px rgba(15,23,42,.14)}

/* ---------- beaker ---------- */
.lab{padding:10px}
.beaker-shell{
  position:relative;width:100%;aspect-ratio:16/9;border-radius:16px 16px 26px 26px;
  background:linear-gradient(160deg,#cbd7de,#a9b7c4);padding:6px 7px 13px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
}
#tank{
  position:relative;width:100%;height:100%;overflow:hidden;border-radius:11px 11px 20px 20px;
  background:radial-gradient(120% 90% at 50% 0%,var(--water2),var(--water1));
  box-shadow:inset 0 0 30px rgba(15,118,110,.10),inset 0 2px 0 rgba(255,255,255,.6);
}
#tank::after{content:'';position:absolute;left:0;right:0;bottom:0;height:16%;background:linear-gradient(to top,rgba(15,118,110,.12),transparent);pointer-events:none}
.tank-label{position:absolute;right:14px;bottom:10px;color:rgba(15,118,110,.4);font-family:var(--font-display);font-weight:700;font-size:1.4rem;letter-spacing:1px}
.bubble{position:absolute;bottom:-14px;border-radius:50%;background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px rgba(15,118,110,.15);pointer-events:none;animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0);opacity:0}10%{opacity:.8}to{transform:translateY(-120%);opacity:0}}
.ion{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:700;line-height:1;user-select:none;pointer-events:none;background:rgba(255,255,255,.72);backdrop-filter:blur(1px);box-shadow:0 1px 6px rgba(30,41,59,.16)}
@keyframes ionSpawn{0%{opacity:0;filter:brightness(2.4) saturate(1.6)}100%{opacity:1;filter:brightness(1) saturate(1)}}
.ion.spawning{animation:ionSpawn .35s ease-out}
.precip{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid rgba(30,41,59,.14);color:#1f2937;font-weight:800;user-select:none;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.28)}
@keyframes precipSettle{0%{filter:brightness(1.5)}100%{filter:brightness(1)}}
.precip.landed{animation:precipSettle .5s ease-out}
.hud{display:flex;justify-content:space-between;align-items:center;padding:11px 4px 2px;font-size:.8rem;color:var(--muted);gap:10px}
.hud strong{color:var(--ink)}
.score-pill{display:flex;align-items:center;gap:6px;color:var(--muted);white-space:nowrap}
.score-pill b{font-family:var(--font-display);color:var(--amber);font-size:1rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;padding:10px 4px 2px;color:var(--muted);font-size:.7rem}
.legend span{display:inline-flex;align-items:center;gap:5px;background:var(--card-soft);border:1px solid var(--line-soft);padding:4px 8px;border-radius:20px}
.dot{width:7px;height:7px;border-radius:50%;box-shadow:0 0 6px currentColor}

/* ---------- controls ---------- */
.controls{padding:15px 14px}
.controls h2{font-family:var(--font-display);font-size:.82rem;margin:0 0 10px;color:var(--ink);font-weight:600;letter-spacing:.2px}
.compound-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.compound-btn{
  position:relative;overflow:hidden;border:1px solid var(--line);background:var(--card-soft);color:var(--ink);
  padding:11px 6px;border-radius:12px;cursor:pointer;font-weight:700;font-size:.86rem;font-family:var(--font-display);
  transition:.15s;
}
.compound-btn:hover,.compound-btn:active{border-color:var(--cyan-line);background:var(--cyan-soft);transform:translateY(-1px)}
.compound-btn .ripple{position:absolute;border-radius:50%;background:rgba(15,118,110,.35);transform:scale(0);pointer-events:none;animation:rippleOut .55s ease-out forwards}
@keyframes rippleOut{to{transform:scale(3.2);opacity:0}}

.speed-row{margin-top:16px}
.speed-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.speed-btn{
  border:1px solid var(--line);background:var(--card-soft);color:var(--muted);
  padding:9px 6px;border-radius:11px;cursor:pointer;font-weight:700;font-size:.78rem;font-family:var(--font-display);
  transition:.15s;
}
.speed-btn:hover{border-color:var(--cyan-line);color:var(--cyan)}
.speed-btn.active{background:var(--cyan-soft);border-color:var(--cyan-line);color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan-line)}

.size-row{margin-top:16px}
.size-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.size-btn{
  border:1px solid var(--line);background:var(--card-soft);color:var(--muted);
  padding:9px 6px;border-radius:11px;cursor:pointer;font-weight:700;font-size:.78rem;font-family:var(--font-display);
  transition:.15s;
}
.size-btn:hover{border-color:var(--cyan-line);color:var(--cyan)}
.size-btn.active{background:var(--cyan-soft);border-color:var(--cyan-line);color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan-line)}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:.72rem;gap:10px;flex-wrap:wrap}
.toolbar-left{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.reset-btn{border:1px solid var(--line);background:var(--card-soft);color:var(--ink);padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:600;transition:.15s}
.reset-btn:hover{border-color:var(--cyan-line);color:var(--cyan)}
.hint{margin:11px 0 0;color:var(--muted-dim);font-size:.71rem;line-height:1.6}

/* ---------- Fullscreen (simulated, works across mobile browsers) ---------- */
#labFullscreenWrap.lab-fs{
  position:fixed;inset:0;z-index:9997;background:var(--bg-glow),var(--bg);
  padding:12px;overflow:auto;display:flex;flex-direction:column;gap:10px;
}
#labFullscreenWrap.lab-fs .lab{flex:1;display:flex;flex-direction:column;min-height:0;}
#labFullscreenWrap.lab-fs .beaker-shell{flex:1;min-height:220px;aspect-ratio:auto;}
#labFullscreenWrap.lab-fs .controls{flex:none;}
.fs-exit{
  position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:9999;
  border:1px solid rgba(255,255,255,.15);background:rgba(10,16,28,.8);backdrop-filter:blur(8px);
  color:#eef3fb;padding:9px 14px;border-radius:10px;font-size:.78rem;font-weight:700;cursor:pointer;display:none;
}
.fs-exit.show{display:block}

@media(max-width:700px){
 body{padding:12px 8px 28px}
 .compound-grid{grid-template-columns:repeat(2,1fr)}
 .speed-grid{grid-template-columns:repeat(2,1fr)}
 .size-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">🧪</div>
      <div><h1>Precipitation Reaction</h1><p class="sub">การเกิดปฏิกิริยาของสารประกอบไอออนิก</p></div>
    </div>
  </div>

  <div id="labFullscreenWrap">
    <div class="card lab">
      <div class="beaker-shell">
        <div id="tank">
          <div class="bubble" style="left:18%;width:6px;height:6px;animation-duration:4.8s;animation-delay:.2s"></div>
          <div class="bubble" style="left:42%;width:9px;height:9px;animation-duration:6.2s;animation-delay:1.4s"></div>
          <div class="bubble" style="left:65%;width:5px;height:5px;animation-duration:5.4s;animation-delay:.8s"></div>
          <div class="bubble" style="left:80%;width:7px;height:7px;animation-duration:7s;animation-delay:2.2s"></div>
          <div class="tank-label">H₂O</div>
        </div>
      </div>
      <div class="hud">
        <div class="status">ไอออน</div>
        <div class="score-pill">ตะกอน <b id="scoreVal">0</b></div>
      </div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="card controls" style="margin-top:12px">
      <h2>สารละลาย</h2>
      <div class="compound-grid" id="compoundGrid"></div>

      <div class="speed-row">
        <h2>ความเร็วของไอออน</h2>
        <div class="speed-grid" id="speedGrid"></div>
      </div>

      <div class="size-row">
        <h2>ขนาดของไอออน</h2>
        <div class="size-grid" id="sizeGrid"></div>
      </div>

      <div class="toolbar">
        <div class="toolbar-left">
          <button class="reset-btn" id="resetBtn">↺ เริ่มใหม่</button>
          <button class="reset-btn" id="labFsBtn">⛶ เต็มจอ</button>
        </div>
      </div>

      <p class="hint"></p>
    </div>
  </div>
</div>

<button class="fs-exit" id="fsExitBtn">✕ ออกจากเต็มจอ</button>

<script>
/* =========================
   Chemistry data
   ========================= */
const ION_COLOR = {
  'Ca2+':'#f59e0b','K+':'#8b5cf6','Na+':'#fb7185','Cu2+':'#0ea5e9','Pb2+':'#a8a29e','NH4+':'#f472b6',
  'Cl-':'#a78bfa','I-':'#f97316','CO3^2-':'#3b82f6','SO4^2-':'#22d3ee','NO3-':'#94a3b8'
};
const ION_LABEL = {
  'Ca2+':'Ca²⁺','K+':'K⁺','Na+':'Na⁺','Cu2+':'Cu²⁺','Pb2+':'Pb²⁺','NH4+':'NH₄⁺',
  'Cl-':'Cl⁻','I-':'I⁻','CO3^2-':'CO₃²⁻','SO4^2-':'SO₄²⁻','NO3-':'NO₃⁻'
};
const COMPOUNDS = {
  'CaCl2':    { cation:{type:'Ca2+',n:1}, anion:{type:'Cl-',n:2} },
  'KI':       { cation:{type:'K+',n:1},   anion:{type:'I-',n:1} },
  'NaCl':     { cation:{type:'Na+',n:1},  anion:{type:'Cl-',n:1} },
  'Na2CO3':   { cation:{type:'Na+',n:2},  anion:{type:'CO3^2-',n:1} },
  'CuSO4':    { cation:{type:'Cu2+',n:1}, anion:{type:'SO4^2-',n:1} },
  'Pb(NO3)2': { cation:{type:'Pb2+',n:1}, anion:{type:'NO3-',n:2} },
  'NH4Cl':    { cation:{type:'NH4+',n:1}, anion:{type:'Cl-',n:1} },
  'NaNO3':    { cation:{type:'Na+',n:1},  anion:{type:'NO3-',n:1} }
};
const PRECIPITATES = {
  'Pb2+_Cl-':'PbCl₂','Pb2+_I-':'PbI₂','Pb2+_CO3^2-':'PbCO₃','Pb2+_SO4^2-':'PbSO₄',
  'Ca2+_CO3^2-':'CaCO₃','Ca2+_SO4^2-':'CaSO₄','Cu2+_CO3^2-':'CuCO₃'
};
/* Colors reflect the real precipitate: PbI2 is the classic bright-yellow
   "golden rain" precipitate, CuCO3 is blue-green, the rest are white/off-white. */
const PRECIPITATE_COLOR = {
  'Pb2+_Cl-':'#f1f5f9','Pb2+_I-':'#facc15','Pb2+_CO3^2-':'#f1f5f9','Pb2+_SO4^2-':'#f1f5f9',
  'Ca2+_CO3^2-':'#f1f5f9','Ca2+_SO4^2-':'#f1f5f9','Cu2+_CO3^2-':'#5eead4'
};
const SPEED_LEVELS = [
  { label:'ช้า',      value:0.5 },
  { label:'ปกติ',     value:1   },
  { label:'เร็ว',      value:1.8 },
  { label:'เร็วมาก',   value:2.8 }
];
const SIZE_LEVELS = [
  { label:'เล็ก',    value:0.7 },
  { label:'กลาง',    value:1   },
  { label:'ใหญ่',    value:1.4 },
  { label:'ใหญ่มาก', value:1.9 }
];
const BASE_ION_RADIUS = 25;

/* =========================
   UI setup
   ========================= */
function toSub(d){const map={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};return d.split('').map(x=>map[x]).join('')}
function prettyName(name){return name.replace(/(\d+)/g,m=>toSub(m))}

const grid=document.getElementById('compoundGrid');
Object.keys(COMPOUNDS).forEach(name=>{
  const b=document.createElement('button');
  b.className='compound-btn'; b.textContent=prettyName(name);
  b.addEventListener('click',(e)=>{
    const rect=b.getBoundingClientRect();
    const ripple=document.createElement('span');
    ripple.className='ripple';
    const size=Math.max(rect.width,rect.height);
    ripple.style.width=ripple.style.height=size+'px';
    ripple.style.left=(e.clientX-rect.left-size/2)+'px';
    ripple.style.top=(e.clientY-rect.top-size/2)+'px';
    b.appendChild(ripple);
    setTimeout(()=>ripple.remove(),560);
    dissolve(name);
  });
  grid.appendChild(b);
});

const legend=document.getElementById('legend');
Object.keys(ION_COLOR).forEach(t=>{const s=document.createElement('span');s.innerHTML=`<span class="dot" style="background:${ION_COLOR[t]};color:${ION_COLOR[t]}"></span>${ION_LABEL[t]}`;legend.appendChild(s)});

/* ---- speed selector ---- */
let speedMultiplier = 1;
const speedGrid=document.getElementById('speedGrid');
SPEED_LEVELS.forEach(level=>{
  const b=document.createElement('button');
  b.className='speed-btn'+(level.value===speedMultiplier?' active':'');
  b.textContent=level.label;
  b.dataset.speed=level.value;
  b.addEventListener('click',()=>setSpeed(level.value));
  speedGrid.appendChild(b);
});
function setSpeed(newValue){
  const ratio = newValue/speedMultiplier;
  ions.forEach(ion=>{ ion.vx*=ratio; ion.vy*=ratio; });
  speedMultiplier = newValue;
  document.querySelectorAll('.speed-btn').forEach(b=>{
    b.classList.toggle('active', parseFloat(b.dataset.speed)===newValue);
  });
}

/* ---- size selector ---- */
let sizeMultiplier = 1;
const sizeGrid=document.getElementById('sizeGrid');
SIZE_LEVELS.forEach(level=>{
  const b=document.createElement('button');
  b.className='size-btn'+(level.value===sizeMultiplier?' active':'');
  b.textContent=level.label;
  b.dataset.size=level.value;
  b.addEventListener('click',()=>setSize(level.value));
  sizeGrid.appendChild(b);
});
function setSize(newValue){
  sizeMultiplier = newValue;
  const newR = BASE_ION_RADIUS*sizeMultiplier;
  const {w,h}=tankSize();
  ions.forEach(ion=>{
    ion.r = newR;
    ion.el.style.width = ion.el.style.height = (newR*2)+'px';
    ion.x = Math.min(Math.max(ion.x, newR), Math.max(newR, w-newR));
    ion.y = Math.min(Math.max(ion.y, newR), Math.max(newR, h-newR));
  });
  document.querySelectorAll('.size-btn').forEach(b=>{
    b.classList.toggle('active', parseFloat(b.dataset.size)===newValue);
  });
}

/* =========================
   Fullscreen (single lab panel — reliable on iOS/Android/desktop alike)
   ========================= */
const labWrap=document.getElementById('labFullscreenWrap');
const labFsBtn=document.getElementById('labFsBtn');
const fsExitBtn=document.getElementById('fsExitBtn');
let fsActive=false;
function updateExitBtn(){ fsExitBtn.classList.toggle('show', fsActive); }
function exitFs(){ labWrap.classList.remove('lab-fs'); fsActive=false; updateExitBtn(); }
labFsBtn.addEventListener('click',()=>{
  if(fsActive){ exitFs(); return; }
  labWrap.classList.add('lab-fs'); fsActive=true; updateExitBtn();
});
fsExitBtn.addEventListener('click', exitFs);

/* =========================
   Game physics
   ========================= */
const tank=document.getElementById('tank'), scoreVal=document.getElementById('scoreVal');
let ions=[], settles=[], precipList=[], idCounter=0, score=0;
const COLLISION_MULTIPLIER=1.6;

function tankSize(){const r=tank.getBoundingClientRect();return{w:r.width,h:r.height}}
function dissolve(name){
  const c=COMPOUNDS[name];
  spawnIons(c.cation.type,c.cation.n); spawnIons(c.anion.type,c.anion.n);
}
function findFreeSpot(w,h,r,against){
  let bestX=null,bestY=null,bestMinDist=-Infinity;
  for(let k=0;k<30;k++){
    const x=r+Math.random()*(w-2*r), y=r+Math.random()*(h-2*r);
    let minDist=Infinity,ok=true;
    for(const o of against){
      const d=Math.hypot(x-o.x,y-o.y);
      minDist=Math.min(minDist,d);
      if(d<(r+o.r)*1.08){ok=false}
    }
    if(ok)return{x,y};
    if(minDist>bestMinDist){bestMinDist=minDist;bestX=x;bestY=y}
  }
  return{x:bestX??r+Math.random()*(w-2*r),y:bestY??r+Math.random()*(h-2*r)};
}
function spawnIons(type,n){
  const {w,h}=tankSize(), r=BASE_ION_RADIUS*sizeMultiplier;
  for(let i=0;i<n;i++){
    const el=document.createElement('div'); el.className='ion spawning';
    el.style.width=el.style.height=r*2+'px';
    el.style.background='#ffffff';
    el.style.border=`1.5px solid ${ION_COLOR[type]}`;
    el.style.color='#1e293b';
    el.style.fontSize='.78rem'; el.textContent=ION_LABEL[type]; tank.appendChild(el);
    el.addEventListener('animationend',()=>el.classList.remove('spawning'),{once:true});
    const {x,y}=findFreeSpot(w,h,r,ions);
    const angle=Math.random()*Math.PI*2, speed=(.75+Math.random()*.7)*speedMultiplier;
    const ion={id:idCounter++,type,el,x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,r};
    ions.push(ion);
  }
}
function resetAll(){
  ions.forEach(i=>i.el.remove()); ions=[];
  precipList.forEach(p=>p.el.remove()); precipList=[];
  settles=[]; score=0; scoreVal.textContent='0';
}
document.getElementById('resetBtn').addEventListener('click',resetAll);
function precipKey(a,b){const cat=a.includes('+')?a:b, an=a.includes('-')?a:b;return cat+'_'+an}
function isCation(t){return t.includes('+')}
const SETTLE_GAP=3;
function floorYAt(x,r,h){
  let floorY=h-r;
  for(const s of settles){
    if(Math.abs(x-s.x)<r+s.r+SETTLE_GAP){
      const topOfStack=s.y-s.r-r-SETTLE_GAP;
      if(topOfStack<floorY)floorY=topOfStack;
    }
  }
  return floorY;
}
function findSettleX(w,h,r){
  let bestX=r+Math.random()*(w-2*r),bestY=-Infinity;
  for(let k=0;k<25;k++){
    const x=r+Math.random()*(w-2*r);
    const y=floorYAt(x,r,h);
    if(y>bestY){bestY=y;bestX=x}
  }
  return bestX;
}
function spawnPrecipitate(formula,key,x,y){
  const {w,h}=tankSize(),r=30,el=document.createElement('div');
  el.className='precip';el.style.width=el.style.height=r*2+'px';el.style.fontSize='.78rem';el.textContent=formula;
  el.style.background=PRECIPITATE_COLOR[key]||'#f1f5f9';
  tank.appendChild(el);
  const p={el,x,y,targetX:findSettleX(w,h,r),r,vy:.3,state:'falling'};precipList.push(p);
  score++;scoreVal.textContent=String(score);
}
function step(){
  const {w,h}=tankSize();
  for(const ion of ions){
    ion.x+=ion.vx;ion.y+=ion.vy;
    if(ion.x-ion.r<0){ion.x=ion.r;ion.vx*=-1}
    if(ion.x+ion.r>w){ion.x=w-ion.r;ion.vx*=-1}
    if(ion.y-ion.r<0){ion.y=ion.r;ion.vy*=-1}
    if(ion.y+ion.r>h){ion.y=h-ion.r;ion.vy*=-1}
  }
  const toRemove=new Set();
  for(let i=0;i<ions.length;i++){
    if(toRemove.has(i))continue;
    for(let j=i+1;j<ions.length;j++){
      if(toRemove.has(j))continue;
      const a=ions[i],b=ions[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||.0001;
      const reactDistance=(a.r+b.r)*COLLISION_MULTIPLIER;
      if(dist<reactDistance){
        const opposite=isCation(a.type)!==isCation(b.type);
        if(opposite){
          const key=precipKey(a.type,b.type);
          if(PRECIPITATES[key]){
            toRemove.add(i);toRemove.add(j);
            const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
            a.el.remove();b.el.remove();spawnPrecipitate(PRECIPITATES[key],key,mx,my);continue;
          }
        }
      }
      const touchDistance=a.r+b.r;
      if(dist<touchDistance){
        const nx=dx/dist,ny=dy/dist;
        const overlap=(touchDistance-dist)/2+.3;
        a.x-=nx*overlap;a.y-=ny*overlap;b.x+=nx*overlap;b.y+=ny*overlap;
        const dvx=b.vx-a.vx,dvy=b.vy-a.vy;
        const velAlongNormal=dvx*nx+dvy*ny;
        if(velAlongNormal<0){
          const jImpulse=-velAlongNormal;
          a.vx-=jImpulse*nx;a.vy-=jImpulse*ny;
          b.vx+=jImpulse*nx;b.vy+=jImpulse*ny;
        }
      }
    }
  }
  if(toRemove.size)ions=ions.filter((_,idx)=>!toRemove.has(idx));
  for(const ion of ions)ion.el.style.transform=`translate(${ion.x-ion.r}px,${ion.y-ion.r}px)`;
  for(const p of precipList){
    if(p.state==='falling'){
      p.vy+=.06;p.y+=p.vy;p.x+=(p.targetX-p.x)*.025;
      const floorY=floorYAt(p.x,p.r,h);
      if(p.y>=floorY){
        p.y=floorY;p.state='settled';settles.push({x:p.x,y:p.y,r:p.r});
        p.el.classList.add('landed');
        p.el.addEventListener('animationend',()=>p.el.classList.remove('landed'),{once:true});
      }
    }
    p.el.style.transform=`translate(${p.x-p.r}px,${p.y-p.r}px)`;
  }
  requestAnimationFrame(step);
}
requestAnimationFrame(step);
</script>
